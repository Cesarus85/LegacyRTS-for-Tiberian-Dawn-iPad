# Place inside the sportaktivfitness.de TLS VirtualHost. Keep the HTTP health
# rule before the WebSocket rule because ProxyPass uses first-match ordering.
SetEnvIf Request_URI "^/tiberian-dawn-relay(?:/|$)" tiberian_relay_request
CustomLog ${APACHE_LOG_DIR}/sportaktivfitness_access.log combined env=!tiberian_relay_request

ProxyPass        /tiberian-dawn-relay/healthz http://127.0.0.1:8820/healthz connectiontimeout=5 timeout=10 retry=0
ProxyPassReverse /tiberian-dawn-relay/healthz http://127.0.0.1:8820/healthz
ProxyPass        /tiberian-dawn-relay ws://127.0.0.1:8820/tiberian-dawn-relay connectiontimeout=5 timeout=3600 retry=0
ProxyPassReverse /tiberian-dawn-relay ws://127.0.0.1:8820/tiberian-dawn-relay
