name: Create draft source release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag to publish as a draft
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Check public source tree
        run: ./scripts/check-release-tree.sh
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Tiberian Dawn for iPad $RELEASE_TAG"
